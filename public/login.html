<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portfólio</title>
    <link rel="stylesheet" href="/css/login-style.css">
</head>
<body>

    <div class="center">
        <h1>Login</h1>

        <form onsubmit="logar(); return false;">
            <div class="txt_field">
                <<input type="email" id="email" required>
                <label for="email">Email</label>
            </div>

            <div class="txt_field">
    <input type="password" id="senha" required>
    <label for="senha">Senha</label>
    <button type="button" class="toggle-pass" id="btn-olho" onclick="alternarSenha()" aria-label="Mostrar/Ocultar senha">
        <svg id="icone-olho" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>
    </button>
</div>

            <div class="pass">
                Esqueceu a senha?
            </div>

            <div class="botoes">
                <input type="submit" value="Conectar" class="btn-conectar">
                <input type="button" value="Cancelar" class="btn-cancelar" onclick="window.location.href='login.html'">
            </div>

            <div class="signup_link">
                <a href="#">Não é membro? Cadastre-se</a>
            </div>
        </form>
    </div>

    <script src="/js/script.js"></script>
</body>
</html>
