<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Caminhos relativos para o CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/perfil-style.css">

    <title>Meu Perfil - Daniel</title>
</head>

<body>

    <header>
        <button class="logout-btn" onclick="logout()">Sair</button>

        <nav>
            <ul>
                <li><a href="index.html">Sobre mim</a></li>
                <li><a href="project.html">Projetos</a></li>
                <li><a href="contact.html">Contatos</a></li>
                <li><a href="areas.html">Áreas do Conhecimento</a></li>
                <li><a href="perfil.html">Meu Perfil</a></li>
            </ul>
        </nav>
    </header>

    <main class="perfil-container">

        <div class="perfil-header">
            <div class="foto-perfil">👤</div>
            <h1>Meu Perfil</h1>
            <p id="usuario-logado">Carregando informações...</p>
        </div>

        <div class="perfil-info">
            <div class="campo">
                <span>Nome</span>
                <strong id="nome-usuario">Carregando...</strong>
            </div>

            <div class="campo">
                <span>E-mail</span>
                <strong id="email-usuario">Carregando...</strong>
            </div>

            <div class="campo">
                <span>Tipo de usuário</span>
                <strong id="tipo-usuario">Carregando...</strong>
            </div>

            <div class="campo">
                <span>Data de criação</span>
                <strong id="data-criacao">Em breve</strong>
            </div>
        </div>

        <div class="perfil-botoes">
            <button onclick="editarPerfil()">Editar perfil</button>
            <button onclick="alterarSenha()">Alterar senha</button>
            <button class="btn-sair" onclick="logout()">Sair da conta</button>
        </div>

        <a class="voltar" href="./index.html">← Voltar para o portfólio</a>

    </main>

    <footer>
        <div class="copyright">
            <p>&copy; <span id="ano-atual"></span> Dan L. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Supabase SDK e Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/script.js"></script>
</body>

</html>
